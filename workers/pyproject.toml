[project]
name = "nesurf-workers"
version = "0.1.0"
description = "NOAA data ingestion workers for the New England surf forecast app"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "eccodes>=2.37",      # ships its own libeccodes wheel; no Homebrew needed
    "requests>=2.31",
    "jsonschema>=4.20",
    "scipy>=1.12",
    "xarray>=2024.1",
    "netCDF4>=1.6",
    "global-land-mask>=1.0",
    "pillow>=10",
    "scikit-fmm>=2024.05",
    "mapbox-vector-tile>=2.0",
    "shapely>=2.0",
]

[project.optional-dependencies]
pinn = ["torch>=2.3", "fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]

[tool.setuptools]
packages = ["nesurf", "pinn"]

[tool.uv]
package = false
