<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NE Surf Overview — Free Map</title>
</head>
<body>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700;800&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
body{margin:0;font-family:'Barlow',system-ui,sans-serif;background:#0e2029;color:#e8eef2;-webkit-font-smoothing:antialiased}
a{color:#4798b7}a:hover{color:#6bb8d6}
button{font-family:inherit}
</style>

<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0e2029; box-sizing: border-box; font-family: 'Barlow', system-ui, sans-serif;">

  <!-- MAP LAYER (placeholder for the map engine: satellite tiles + swell heat + wind streamlines + break markers) -->
  <img src="map_layer.jpg" alt="Satellite map of the New England coast with swell and wind overlays" style="position: absolute; left: 0px; top: 140px; width: 390px; height: 704px; object-fit: cover; display: block;">

  <!-- COMPACT HEADER (v6 2026-09-22): one glass bar — title row + 7-day forecast timeline -->
  <div style="position: absolute; left: 0px; top: 0px; width: 390px; background: rgba(14,32,41,0.72); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border-bottom: 1px solid rgba(255,255,255,0.10); box-sizing: border-box; padding: calc(8px + env(safe-area-inset-top)) 12px 8px 12px; z-index: 5;">
    <div style="display: flex; align-items: center; gap: 8px; height: 28px;">
      <div style="width: 24px; height: 24px; border-radius: 6px; background: #4798b7; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0e2029" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 17 9 11 13 15 21 7"></polyline><polyline points="15 7 21 7 21 13"></polyline></svg>
      </div>
      <div style="flex-grow: 1; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #e8eef2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">NE Surf Overview</div>
      <div style="font-size: 10px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #cfe0ea; white-space: nowrap;">Tue, Sept 22</div>
      <button aria-label="Open menu" style="width: 44px; height: 44px; margin-right: -12px; background: transparent; border: 0; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#e8eef2" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"></line><line x1="4" y1="12" x2="20" y2="12"></line><line x1="4" y1="17" x2="20" y2="17"></line></svg>
      </button>
    </div>
    <div style="display: flex; align-items: center; gap: 4px; margin-top: 6px;">
      <button aria-label="Previous day" style="width: 24px; height: 24px; margin-left: -6px; background: transparent; border: 0; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#e8eef2" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 5 8 12 15 19"></polyline></svg>
      </button>
      <div style="flex-grow: 1; position: relative; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px;">
            <button aria-label="Sat 2–3 ft" style="height: 56px; padding: 0px; background: transparent; border: 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 2px; min-width: 0px;">
              <div style="font-size: 9px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #9fb1bc;">Sat</div>
              <div style="font-size: 11px; font-weight: 700; color: #ffffff; white-space: nowrap;">2–3 ft</div>
              <div style="font-size: 8px; font-weight: 500; color: #b8c7d1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;">8 s · NW</div>
              <div style="width: 100%; height: 6px; border-radius: 3px; margin-top: auto; background: #f3c79e; opacity: 1;"></div>
            </button>
            <button aria-label="Sun 3–4 ft" style="height: 56px; padding: 0px; background: transparent; border: 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 2px; min-width: 0px;">
              <div style="font-size: 9px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #9fb1bc;">Sun</div>
              <div style="font-size: 11px; font-weight: 700; color: #ffffff; white-space: nowrap;">3–4 ft</div>
              <div style="font-size: 8px; font-weight: 500; color: #b8c7d1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;">9 s · N</div>
              <div style="width: 100%; height: 6px; border-radius: 3px; margin-top: auto; background: #f3c79e; opacity: 1;"></div>
            </button>
            <button aria-label="Mon 2–3 ft" style="height: 56px; padding: 0px; background: transparent; border: 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 2px; min-width: 0px;">
              <div style="font-size: 9px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #9fb1bc;">Mon</div>
              <div style="font-size: 11px; font-weight: 700; color: #ffffff; white-space: nowrap;">2–3 ft</div>
              <div style="font-size: 8px; font-weight: 500; color: #b8c7d1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;">7 s · SW</div>
              <div style="width: 100%; height: 6px; border-radius: 3px; margin-top: auto; background: #9c9ea1; opacity: 1;"></div>
            </button>
            <button aria-label="Tue 4–6 ft" style="height: 56px; padding: 0px; background: transparent; border: 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 2px; min-width: 0px;">
              <div style="font-size: 9px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #ffffff;">Tue</div>
              <div style="font-size: 11px; font-weight: 700; color: #ffffff; white-space: nowrap;">4–6 ft</div>
              <div style="font-size: 8px; font-weight: 500; color: #b8c7d1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;">12 s · SE</div>
              <div style="width: 100%; height: 6px; border-radius: 3px; margin-top: auto; background: #41c776; opacity: 1;"></div>
            </button>
            <button aria-label="Wed 3–4 ft" style="height: 56px; padding: 0px; background: transparent; border: 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 2px; min-width: 0px;">
              <div style="font-size: 9px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #9fb1bc;">Wed</div>
              <div style="font-size: 11px; font-weight: 700; color: #ffffff; white-space: nowrap;">3–4 ft</div>
              <div style="font-size: 8px; font-weight: 500; color: #b8c7d1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;">10 s · E</div>
              <div style="width: 100%; height: 6px; border-radius: 3px; margin-top: auto; background: #f3c79e; opacity: 0.4;"></div>
            </button>
            <button aria-label="Thu 1–2 ft" style="height: 56px; padding: 0px; background: transparent; border: 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 2px; min-width: 0px;">
              <div style="font-size: 9px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #9fb1bc;">Thu</div>
              <div style="font-size: 11px; font-weight: 700; color: #ffffff; white-space: nowrap;">1–2 ft</div>
              <div style="font-size: 8px; font-weight: 500; color: #b8c7d1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;">6 s · S</div>
              <div style="width: 100%; height: 6px; border-radius: 3px; margin-top: auto; background: #9c9ea1; opacity: 0.4;"></div>
            </button>
            <button aria-label="Fri 2–3 ft" style="height: 56px; padding: 0px; background: transparent; border: 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 2px; min-width: 0px;">
              <div style="font-size: 9px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #9fb1bc;">Fri</div>
              <div style="font-size: 11px; font-weight: 700; color: #ffffff; white-space: nowrap;">2–3 ft</div>
              <div style="font-size: 8px; font-weight: 500; color: #b8c7d1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;">8 s · SE</div>
              <div style="width: 100%; height: 6px; border-radius: 3px; margin-top: auto; background: #9c9ea1; opacity: 0.4;"></div>
            </button>
            <div style="position: absolute; top: 42px; left: calc(50.000% - 7px); width: 14px; height: 14px; border-radius: 7px; background: #f0f5f1; box-shadow: 0px 1px 4px rgba(0,0,0,0.5); pointer-events: none;"></div>
      </div>
      <button aria-label="Next day" style="width: 24px; height: 24px; margin-right: -6px; background: transparent; border: 0; padding: 0; display: flex; align-items: center; justify-content: center; cursor: pointer;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#e8eef2" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 5 16 12 9 19"></polyline></svg>
      </button>
    </div>
  </div>

  <!-- MAP CONTROL: LAYERS -->
  <button aria-label="Surf forecast" style="position: absolute; left: 342px; top: 118px; width: 40px; height: 40px; border-radius: 8px; background: rgba(14,33,42,0.7); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border: 1px solid rgba(255,255,255,0.14); box-shadow: 0px 4px 14px rgba(0,0,0,0.35); display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 4;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#e8eef2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 16 8 10 12 14 16 7 21 11"></polyline><line x1="3" y1="20" x2="21" y2="20"></line></svg>
  </button>


  <!-- BREAK CALLOUTS -->
  <div style="position: absolute; left: 204px; top: 214px; height: 24px; padding: 0px 8px; border-radius: 4px; background: #0e212a; box-shadow: 0px 3px 10px rgba(0,0,0,0.4); display: flex; align-items: center; gap: 4px; white-space: nowrap; font-size: 10px; font-weight: 500; color: #ffffff; z-index: 3;">
    <span style="font-weight: 700; color: #41c776; letter-spacing: 0.02em;">HIGGINS:</span>
    <span>4-6ft @ 12s (SE) | NW Wind</span>
  </div>
  <div style="position: absolute; left: 92px; top: 566px; height: 24px; padding: 0px 8px; border-radius: 4px; background: #0e212a; box-shadow: 0px 3px 10px rgba(0,0,0,0.4); display: flex; align-items: center; gap: 4px; white-space: nowrap; font-size: 10px; font-weight: 500; color: #ffffff; z-index: 3;">
    <span style="font-weight: 700; color: #41c776; letter-spacing: 0.02em;">RUGGLES:</span>
    <span>6-8ft @ 14s (SSW) | NNE Wind</span>
  </div>

  <!-- WIDGET DOCK (v5 2026-09-22) -->
  <div style="position: absolute; left: 0px; right: 0px; bottom: 0px; padding: 0px 8px 8px 8px; display: flex; gap: 8px; align-items: stretch; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; z-index: 4;">
    <div role="button" tabindex="0" style="flex: none; width: 148px; height: 164px; border-radius: 12px; background: rgba(14,33,42,0.72); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border: 1px solid rgba(255,255,255,0.10); box-shadow: 0px 8px 24px rgba(0,0,0,0.35); box-sizing: border-box; padding: 10px 10px 8px 10px; display: flex; flex-direction: column; gap: 6px; scroll-snap-align: start; cursor: pointer;">
      <div style="font-size: 9px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #e8eef2;">Surf Quality Hotspot</div>
      <div style="display: flex; gap: 6px; align-items: flex-start;">
        <svg width="16" height="20" viewBox="0 0 16 20" fill="#41c776" style="flex-shrink: 0; margin-top: 1px;"><path d="M8 0 C3.6 0 0 3.5 0 7.8 C0 13.4 8 20 8 20 C8 20 16 13.4 16 7.8 C16 3.5 12.4 0 8 0 Z"></path><circle cx="8" cy="7.8" r="3" fill="#0e2029"></circle></svg>
        <div style="display: flex; flex-direction: column; gap: 1px; min-width: 0px;">
          <div style="font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: #41c776;">Excellent</div>
          <div style="font-size: 10px; font-weight: 500; color: #ffffff; line-height: 1.3;">Higgins: 4-6ft @ 12s</div>
          <div style="font-size: 10px; font-weight: 500; color: #ffffff; line-height: 1.3;">NW wind · Optimal</div>
        </div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: auto;">
        <div style="display: flex; flex-direction: column; gap: 4px; align-items: center;"><div style="width: 100%; height: 8px; border-radius: 4px; background: #41c776;"></div><div style="font-size: 8px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #41c776;">Green</div></div>
        <div style="display: flex; flex-direction: column; gap: 4px; align-items: center;"><div style="width: 100%; height: 8px; border-radius: 4px; background: #f3c79e;"></div><div style="font-size: 8px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #f3c79e;">Moderate</div></div>
        <div style="display: flex; flex-direction: column; gap: 4px; align-items: center;"><div style="width: 100%; height: 8px; border-radius: 4px; background: #9c9ea1;"></div><div style="font-size: 8px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #9c9ea1;">Poor</div></div>
      </div>
    </div>
    <div style="flex: none; width: 148px; height: 164px; border-radius: 12px; background: rgba(14,33,42,0.72); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); border: 1px solid rgba(255,255,255,0.10); box-shadow: 0px 8px 24px rgba(0,0,0,0.35); box-sizing: border-box; padding: 10px 10px 8px 10px; display: flex; flex-direction: column; gap: 6px; scroll-snap-align: start;">
      <div style="font-size: 9px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #e8eef2;">Legend</div>
      <div style="font-size: 9px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #b8c7d1;">Swell energy</div>
      <div style="height: 8px; border-radius: 4px; background: linear-gradient(90deg, #64d5cc 0%, #4798b7 40%, #2b5bc7 75%, #163797 100%);"></div>
      <div style="display: flex; justify-content: space-between; font-size: 10px; font-weight: 500; color: #ffffff;"><span>Low</span><span>Clean</span><span>High</span></div>
      <div style="font-size: 9px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #b8c7d1; margin-top: 4px;">Wind on the beach</div>
      <div style="height: 8px; border-radius: 4px; background: linear-gradient(90deg, #27a055 0%, #a8c24a 45%, #f0a24a 75%, #e66729 100%);"></div>
      <div style="display: flex; justify-content: space-between; font-size: 10px; font-weight: 500; color: #ffffff;"><span>Offshore</span><span>Onshore</span></div>
    </div>
  </div>

</div>

</body>
</html>
